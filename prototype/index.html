<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131d"><title>PRO KAYAK FISHING</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head><body>
<div id="map"></div><canvas id="wind"></canvas>
<header><b>🎣 <i>PRO KAYAK</i> FISHING</b><span id="place">اختر نقطة على الخريطة</span></header>
<nav id="tools">
<button data-layer="wind" class="on">🌬️ رياح</button><button data-layer="waves">🌊 أمواج</button>
<button data-layer="current">↗️ تيارات</button><button data-layer="sst">🌡️ SST</button>
<button data-layer="depth">📏 أعماق</button><button id="gps">📍 GPS</button><button id="sat">🛰️</button>
</nav>
<section id="panel">
<div class="tabs"><button class="on" data-tab="map">الخريطة</button><button data-tab="planner">🎣 مخطط الصيد</button><button data-tab="spots">⭐ النقاط</button></div>
<div class="cards"><div><small>الرياح</small><b id="w">--</b></div><div><small>الهبات</small><b id="g">--</b></div><div><small>الأمواج</small><b id="wh">--</b></div><div><small>حرارة البحر</small><b id="sstv">--</b></div></div>
<div class="score">🎣 Fishing Score <strong id="score">--</strong><em><i id="bar"></i></em></div>
<div class="timeline"><b id="clock">--:--</b><input id="time" type="range" min="0" max="0" value="0"><button id="play">▶</button></div>
<div id="msg">بيانات الطقس والبحر ستتحدث عند اختيار نقطة.</div>
</section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script>
</body></html>
